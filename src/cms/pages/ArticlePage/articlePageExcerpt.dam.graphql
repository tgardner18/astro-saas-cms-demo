fragment ArticlePageExcerpt on ArticlePage {
    _metadata {
        ...PageUrl
        key
    }
    InsightType
    PromoImage {
        ...ContentUrl
        ...ContentReferenceItem
    }
    Heading
    SubHeading
    Author
    Body {
        html
    }
    ReadTime
    ArticleTaxonomy {
        ArticleTopic
        SubtopicAuto
        SubtopicFinancialHardship
        SubtopicHome
        SubtopicLifeStages
        SubtopicPersonalFinances
        SubtopicRetirement
    }
}
