fragment ArticlePage on ArticlePage {
    _metadata {
        ...PageUrl
        published
        displayName
    }
    InsightType
    PromoImage {
        ...ContentUrl
    }
    Heading
    SubHeading
    Author
    Body {
        html
    }
    ReadTime
    InfographicImage {
        ...ContentUrl
    }
    ArticleTaxonomy {
        ArticleTopic
        SubtopicAuto
        SubtopicFinancialHardship
        SubtopicHome
        SubtopicLifeStages
        SubtopicPersonalFinances
        SubtopicRetirement
    }
    SeoSettings {
        ...PageSeoSettingsProperty
    }
    PageAdminSettings {
        ...PageAdminSettingsProperty
    }
}
