fragment AbaWebinarPage on AbaWebinarPage {
    _metadata {
        ...PageUrl
        published
        displayName
    }
    WebinarTitle
    StartDateTime
    EndDateTime
    Restrictions
    Description {
        html
    }
    WebinarUrl
    Speakers
    SupportingAssets {
        ...ContentUrl
    }
    ProductId
    NonMemberPrice
    MemberPrice
    CeCreditsAvailable
    CreditsDescription {
        html
    }
    Audience
    ContentSchema {
        html
    }
    SeoSettings {
        ...PageSeoSettingsProperty
    }
    PageAdminSettings {
        ...PageAdminSettingsProperty
    }
}
