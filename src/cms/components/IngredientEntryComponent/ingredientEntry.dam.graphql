fragment IngredientEntry on IngredientEntry {
    IngredientName
    CasNumber
    Function
    OnDesignatedList {
        html
    }
}

query getIngredientEntriesByKeys($keys: [String], $loc: [Locales]) {
    IngredientEntry(
        ids: $keys
        locale: $loc
        limit: 100
    ) {
        items {
            _metadata { key }
            ...IngredientEntry
        }
    }
}
